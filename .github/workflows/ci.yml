name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          if-no-files-found: error

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_HOSTNAME: ${{ secrets.FTP_HOSTNAME }}
    steps:
      - name: Check FTP secrets
        run: |
          for name in FTP_USERNAME FTP_PASSWORD FTP_HOSTNAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit "${missing:-0}"
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Sync via FTP
        run: lftp "ftp://${FTP_USERNAME}:${FTP_PASSWORD}@${FTP_HOSTNAME}" -e "set ftp:ssl-allow off; mirror -v -e -R ./build /html; quit"
